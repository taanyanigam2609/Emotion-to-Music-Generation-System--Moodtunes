<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodTunes | Neural Audio Synthesis</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="glass-nav">
        <a href="{{ url_for('index') }}" class="logo-link">
            <div class="gradient-text">MoodTunes</div>
        </a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
            <li><a href="{{ url_for('howitworks') }}" class="{% if request.endpoint == 'howitworks' %}active{% endif %}">Workflow</a></li>
            <li><a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">Architecture</a></li>
            <li><a href="{{ url_for('faqs') }}" class="{% if request.endpoint == 'faqs' %}active{% endif %}">FAQ</a></li>
            <li><a href="{{ url_for('contact') }}" class="{% if request.endpoint == 'contact' %}active{% endif %}">Contact</a></li>
            <li><a href="{{ url_for('generate_page') }}" class="{% if request.endpoint == 'generate_page' %}active{% endif %}">AI Studio</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 MoodTunes AI. Powered by Conditional LSTM Networks.</p>
    </footer>
</body>
</html>
